version: '3.8'

# ZMYL 双容器部署（Node.js API + Nginx 前端）
# 使用前：cp server/.env.example server/.env 并设置 JWT_SECRET 等

services:
  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    image: zmyl-api:latest
    container_name: zmyl-api
    expose:
      - "8080"
    volumes:
      - ./server/data:/app/data
      - ./server/logs:/app/logs
      - ./server/uploads:/app/uploads
    env_file:
      - ./server/.env
    restart: unless-stopped

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: zmyl-web:latest
    container_name: zmyl-web
    ports:
      - "80:80"
    depends_on:
      - api
    restart: unless-stopped