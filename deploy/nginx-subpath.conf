# ZMYL 子路径部署（http://服务器/yl/）nginx 参考配置
#
# 使用步骤：
#   1. 构建前端时带 base 前缀（本地或服务器上执行）：
#        BASE_PATH=/yl/ ./start.sh --rebuild
#   2. 后端在服务器 8888 端口跑起来（./start.sh 或 pm2）
#   3. 把本文件 location 块并入你已有的 server {}，nginx -s reload
#
# 原理：/yl/ 前缀转发到后端时被去掉（proxy_pass 末尾带 /），
#       Express 收到的还是 /assets/...、/api/...，前端资源引用带 /yl/ 前缀，两边对上。

server {
    listen 80;
    server_name _;

    # 前端 + API 一体转发（Express 单进程同端口托管）
    location /yl/ {
        proxy_pass http://127.0.0.1:8888/;      # 末尾 / 很关键：去掉 /yl 前缀
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        client_max_body_size 25m;               # PDF 资料上传上限
    }

    # 用户不带尾斜杠也能访问
    location = /yl {
        return 301 /yl/;
    }
}
